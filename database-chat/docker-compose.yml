# ${DB_PASSWORD} is substituted from the repo-root .env, which compose does not find on
# its own — it only reads a .env sitting next to this file. Start it with:
#   docker compose --env-file ../.env up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: chat-db
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
